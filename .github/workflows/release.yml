name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: "1"
  BIN_NAME: ragnarok-spritesheet-generator

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev \
            libfuse2 \
            imagemagick \
            wget \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked --bin "${BIN_NAME}"

      - name: Package AppImage
        run: |
          set -euxo pipefail
          strip "target/release/${BIN_NAME}" || true

          APPDIR="${GITHUB_WORKSPACE}/AppDir"
          mkdir -p "${APPDIR}/usr/bin"
          cp "target/release/${BIN_NAME}" "${APPDIR}/usr/bin/${BIN_NAME}"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=Ragnarok Spritesheet Generator' \
            'Comment=Ragnarok ACT/SPR spritesheet generator' \
            "Exec=${BIN_NAME}" \
            "Icon=${BIN_NAME}" \
            'Type=Application' \
            'Categories=Graphics;' \
            'Terminal=false' \
            > "${APPDIR}/${BIN_NAME}.desktop"

          convert -size 256x256 xc:'#2c3340' "${APPDIR}/${BIN_NAME}.png"

          wget -q -O linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          ./linuxdeploy-x86_64.AppImage \
            --appdir "${APPDIR}" \
            --desktop-file "${APPDIR}/${BIN_NAME}.desktop" \
            --icon-file "${APPDIR}/${BIN_NAME}.png" \
            --output appimage

          mkdir -p dist
          mv ./*.AppImage \
            "dist/${BIN_NAME}-${GITHUB_REF_NAME}-linux-x86_64.AppImage"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage

  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked --bin ${{ env.BIN_NAME }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${BIN_NAME}.exe" \
            "dist/${BIN_NAME}-${GITHUB_REF_NAME}-windows-x86_64.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

  release:
    name: GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
